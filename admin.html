<body>

<!-- ═══ PROTECTION FRONT TEMPORAIRE ═══ -->
<div id="adminGate" style="position:fixed;inset:0;z-index:99999;background:#f7f4f1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;font-family:'Montserrat',sans-serif;">
  <img src="assets/logo-peace-of-mind-final.png" alt="Peace of Mind" style="max-width:200px;height:auto;opacity:.7" />
  <p style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6B635E;margin:0">Accès réservé</p>
  <input id="adminPwd" type="password" placeholder="Mot de passe" autocomplete="current-password"
    style="padding:12px 18px;border:1px solid #E7DED7;background:#fff;font-family:inherit;font-size:13px;letter-spacing:.05em;color:#111;outline:none;width:240px;text-align:center" />
  <button onclick="(function(){var v=document.getElementById('adminPwd').value;if(btoa(v)==='cG9tMjAyNmFkbWlu'){document.getElementById('adminGate').style.display='none';}else{document.getElementById('adminErr').style.display='block';}})()"
    style="padding:11px 28px;background:#4B2E23;color:#fff;border:none;font-family:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer">
    Accéder
  </button>
  <p id="adminErr" style="display:none;font-size:11px;color:#c0392b;letter-spacing:.08em">Mot de passe incorrect.</p>
  <p style="font-size:10px;color:#aaa;letter-spacing:.06em;margin-top:8px">Protection front temporaire — à remplacer par une auth backend.</p>
</div>
<script>
  document.getElementById('adminPwd').addEventListener('keydown', function(e){
    if(e.key==='Enter') document.querySelector('#adminGate button').click();
  });
</script>

          <input type="date" id="exceptionDate"  />
