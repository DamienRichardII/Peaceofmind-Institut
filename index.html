<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Maintenance — Peace of Mind Institut</title>
  <meta name="description" content="Peace of Mind Institut est actuellement en cours de finalisation. Le parcours de réservation sera bientôt disponible." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" href="assets/logo-peace-of-mind-final.png" type="image/png" />

  <style>
    :root {
      --cream: #FAF6F1;
      --ivory: #F3EDE5;
      --brun: #4A2E1E;
      --brun-soft: #7D5A46;
      --accent: #C8A07A;
      --nude: #D9CCC0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(200, 160, 122, 0.14), transparent 34%),
        linear-gradient(135deg, var(--cream), var(--ivory));
      color: var(--brun);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 5vw, 72px);
      text-align: center;
    }

    main {
      width: min(100%, 760px);
      border: 1px solid rgba(125, 90, 70, 0.18);
      background: rgba(250, 246, 241, 0.72);
      padding: clamp(36px, 7vw, 84px) clamp(24px, 6vw, 72px);
      box-shadow: 0 24px 70px rgba(74, 46, 30, 0.08);
    }

    .logo {
      width: clamp(130px, 22vw, 220px);
      height: auto;
      margin: 0 auto clamp(28px, 4vw, 42px);
      display: block;
    }

    .tag {
      display: block;
      margin-bottom: 18px;
      font-size: 0.72rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 8vw, 5.4rem);
      line-height: 0.95;
      letter-spacing: -0.035em;
      margin-bottom: clamp(22px, 4vw, 34px);
    }

    p {
      color: var(--brun-soft);
      line-height: 1.75;
      font-size: clamp(0.95rem, 1.5vw, 1.08rem);
      max-width: 540px;
      margin: 0 auto;
    }

    .divider {
      width: 72px;
      height: 1px;
      background: var(--nude);
      margin: clamp(26px, 4vw, 42px) auto;
    }

    .location {
      display: block;
      margin-top: 18px;
      color: var(--brun-soft);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      body {
        align-items: stretch;
      }

      main {
        min-height: calc(100vh - 48px);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/logo-peace-of-mind-final.png" alt="Peace of Mind Institut" />

    <span class="tag">Maintenance</span>

    <h1>Peace of Mind Institut</h1>

    <p>
      Le site est actuellement en cours de finalisation afin de vous offrir un parcours de réservation plus clair, sécurisé et personnalisé.
    </p>

    <div class="divider"></div>

    <p>
      Le service de réservation sera bientôt disponible.
      Merci pour votre patience.
    </p>

    <span class="location">Gradignan, Bordeaux</span>
  </main>
</body>
</html>
